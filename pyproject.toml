[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-anomaly"
version = "0.2.0"
description = "Public server-metrics anomaly detection with a reusable Databricks MLOps pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
tracking = ["mlflow>=3.0,<4"]

[project.scripts]
metric-anomaly = "metric_anomaly.run_demo:main"
load_data = "metric_anomaly.load_data:main"
train_model = "metric_anomaly.train_model:main"
score_batch = "metric_anomaly.score_batch:main"
promote_model = "metric_anomaly.promote_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metric_anomaly = ["datasets/*.csv", "datasets/*.json", "datasets/*.md", "datasets/LICENSE"]
