[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metropt-anomaly-detection"
version = "1.0.0"
description = "MetroPT-3 anomaly detection and batch deployment"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4",
  "torch>=2.6,<3",
  "mlflow>=3.0,<4",
  "pyarrow>=15,<25",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]

[project.scripts]
metropt = "anomaly_detection.cli:main"
load_data = "anomaly_detection.databricks_jobs:load_data"
train_model = "anomaly_detection.databricks_jobs:train_model"
score_batch = "anomaly_detection.databricks_jobs:score_batch"
promote_model = "anomaly_detection.databricks_jobs:promote_model"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integration: small complete local MLflow training and inference workflow"]

# CPU execution is intentional; avoid downloading CUDA libraries in Linux CI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
