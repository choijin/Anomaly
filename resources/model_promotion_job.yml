resources:
  jobs:
    promote_model:
      name: metric-anomaly-${bundle.target}-promote
      max_concurrent_runs: 1
      timeout_seconds: 1800
      email_notifications:
        on_failure: ${var.failure_emails}
      parameters:
        - name: source_model
          default: ''
        - name: source_version
          default: ''
        - name: target_model
          default: ${var.catalog}.${var.schema}.metric_anomaly
        - name: approval_ticket
          default: ''
      tasks:
        - task_key: promote_reviewed_version
          existing_cluster_id: ${var.existing_cluster_id}
          python_wheel_task:
            package_name: metric_anomaly
            entry_point: promote_model
            parameters:
              - --source-model
              - '{{job.parameters.source_model}}'
              - --source-version
              - '{{job.parameters.source_version}}'
              - --target-model
              - '{{job.parameters.target_model}}'
              - --approval-ticket
              - '{{job.parameters.approval_ticket}}'
          libraries:
            - whl: ../dist/*.whl
            - pypi:
                package: mlflow>=3.0,<4

# The demo can promote benchmark models only inside a development schema.
targets:
  dev:
    resources:
      jobs:
        promote_model:
          tasks:
            - task_key: promote_reviewed_version
              python_wheel_task:
                package_name: metric_anomaly
                entry_point: promote_model
                # Bundle sequence merging appends this development-only flag.
                parameters:
                  - --allow-benchmark
