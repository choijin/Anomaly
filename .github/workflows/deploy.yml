name: Deploy Databricks jobs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Databricks environment
        type: choice
        options: [dev, prod]
        default: dev
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: databricks-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_catalog: ${{ vars.DATABRICKS_CATALOG }}
      BUNDLE_VAR_existing_cluster_id: ${{ vars.DATABRICKS_CLUSTER_ID }}
      BUNDLE_VAR_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - name: Check code before deployment
        run: |
          uv sync --frozen --extra tracking
          uv run --frozen --extra tracking python -m unittest discover -s tests -v
      - name: Validate bundle
        run: databricks bundle validate --target "$DEPLOY_TARGET"
      - name: Deploy jobs without starting training or promotion
        run: databricks bundle deploy --target "$DEPLOY_TARGET"
