name: Promote reviewed model to production

on:
  workflow_dispatch:
    inputs:
      source_model:
        description: Validated model in catalog.schema.model format
        type: string
        required: true
      source_version:
        description: Explicit validated model version
        type: string
        required: true
      approval_ticket:
        description: Approved change or maintenance review reference
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: databricks-production-model-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_catalog: ${{ vars.DATABRICKS_CATALOG }}
      BUNDLE_VAR_existing_cluster_id: ${{ vars.DATABRICKS_CLUSTER_ID }}
      BUNDLE_VAR_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}
      SOURCE_MODEL: ${{ inputs.source_model }}
      SOURCE_VERSION: ${{ inputs.source_version }}
      APPROVAL_TICKET: ${{ inputs.approval_ticket }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - name: Check explicit promotion inputs
        run: |
          python - <<'PY'
          import os
          import re
          assert re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*', os.environ['SOURCE_MODEL']), 'Use catalog.schema.model'
          assert os.environ['SOURCE_VERSION'].isdigit(), 'Use an explicit numeric version'
          assert os.environ['APPROVAL_TICKET'].strip(), 'Approval reference is required'
          assert ',' not in os.environ['APPROVAL_TICKET'], 'Approval reference cannot contain a comma'
          PY
      - name: Build wheel referenced by the bundle configuration
        run: uv build --wheel
      - name: Promote through the deployed production job
        run: >-
          databricks bundle run --target prod promote_model
          --params "source_model=$SOURCE_MODEL,source_version=$SOURCE_VERSION,approval_ticket=$APPROVAL_TICKET"
