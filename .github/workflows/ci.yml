name: Test and package MetroPT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Verify Databricks requirements match the lockfile
        run: |
          generated_requirements="$(mktemp)"
          checked_requirements="$(mktemp)"
          uv export --frozen --no-dev --no-emit-project --no-hashes --emit-index-url --no-annotate --no-header --quiet --output-file "$generated_requirements"
          sed '/^#/d' requirements/databricks.txt > "$checked_requirements"
          diff -u "$checked_requirements" "$generated_requirements"
          rm "$generated_requirements" "$checked_requirements"
      - name: Verify temporal leakage, event metrics, models, and promotion rules
        run: uv run --frozen pytest
      - name: Build the deployable wheel
        run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: metropt-wheel
          path: dist/*.whl
