bundle:
  name: metropt-anomaly-detection

include:
  - resources/*.yml

artifacts:
  python_package:
    type: whl
    path: .
    build: uv build --wheel

sync:
  exclude:
    - data/**
    - artifacts/**
    - mlruns/**
    - reports/**
    - .venv/**
    - '**/__pycache__/**'
    - .pytest_cache/**

variables:
  catalog:
    description: Existing Unity Catalog catalog.
  existing_cluster_id:
    description: Existing Unity Catalog enabled ML cluster, Python 3.12 / Runtime 16.4 LTS ML or compatible.
  schema:
    description: Separate model and table namespace per environment.
    default: metropt_dev
  raw_data_path:
    description: Uploaded MetroPT-3 CSV in an existing Unity Catalog Volume; set before running load_data.
    default: /Volumes/CHANGE_ME/CHANGE_ME/CHANGE_ME/MetroPT3(AirCompressor).csv
  service_principal_id:
    description: Production job identity; required for prod deployment.
    default: ''
  failure_emails:
    description: Optional job failure notification recipients.
    type: complex
    default: []

targets:
  dev:
    default: true
    mode: development
    variables:
      schema: metropt_dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal_id}
    permissions:
      - service_principal_name: ${var.service_principal_id}
        level: CAN_MANAGE
    variables:
      schema: metropt_prod
